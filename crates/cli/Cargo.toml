[package]
name = "mobile-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
mobile-bridge-android = { version = "0.1.0", path = "../android" }
mobile-bridge-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1.2.1"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
